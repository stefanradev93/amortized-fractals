[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amortized-fractals"
version = "0.1.0"
description = "Amortized Bayesian inference for multifractal models of asset returns"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "bayesflow==2.0.14",
    "keras>=3.15,<4",
    "jax>=0.11.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "scipy>=1.18",
    "umap-learn>=0.5.9,<0.6",
    "matplotlib>=3.11.1",
    "pillow>=10",
    "yfinance>=1",
    "jupyterlab>=4",
]

[tool.setuptools.packages.find]
include = ["mmar", "mmar.*"]
